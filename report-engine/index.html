<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Report Engine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: navy app bar, six-step stepper, one working panel per step; tables scroll inside their own frames. */
:root{
  --bg:#eef1f5; --panel:#ffffff; --panel-2:#f6f8fb; --ink:#152231; --muted:#5a6879; --line:#d9e0e8;
  --brand:#1c3a5a; --brand-ink:#ffffff; --brand-soft:#e3ebf4; --accent:#c96f0a; --accent-soft:#fbefe0;
  --ok:#1d7a4c; --ok-soft:#e2f3ea; --warn:#9a6400; --warn-soft:#fbf1dc; --bad:#b42318; --bad-soft:#fbe7e5;
  --paper:#ffffff; --paper-ink:#1a1f26; --shadow:0 1px 2px rgba(20,34,49,.06),0 4px 16px rgba(20,34,49,.06);
  --f-display:"Archivo","Segoe UI",system-ui,sans-serif; --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141b; --panel:#151e28; --panel-2:#1a2531; --ink:#e4ebf2; --muted:#93a2b3; --line:#283647;
  --brand:#14263a; --brand-ink:#eaf1f8; --brand-soft:#1d3047; --accent:#f0a13c; --accent-soft:#3a2a14;
  --ok:#52c48c; --ok-soft:#163427; --warn:#e2b04f; --warn-soft:#382c12; --bad:#f2786d; --bad-soft:#3d1c1a;
  --paper:#1b2430; --paper-ink:#e4ebf2; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141b; --panel:#151e28; --panel-2:#1a2531; --ink:#e4ebf2; --muted:#93a2b3; --line:#283647;
  --brand:#14263a; --brand-ink:#eaf1f8; --brand-soft:#1d3047; --accent:#f0a13c; --accent-soft:#3a2a14;
  --ok:#52c48c; --ok-soft:#163427; --warn:#e2b04f; --warn-soft:#382c12; --bad:#f2786d; --bad-soft:#3d1c1a;
  --paper:#1b2430; --paper-ink:#e4ebf2; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* app bar */
.bar{background:var(--brand);color:var(--brand-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:17px;font-weight:700;letter-spacing:.01em}
.brand small{display:block;font-size:11.5px;opacity:.78;letter-spacing:.06em;text-transform:uppercase}
.bar .spacer{flex:1}
.jobbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:var(--brand-ink);border-radius:8px;padding:7px 12px;cursor:pointer;display:flex;gap:8px;align-items:center;max-width:100%}
.jobbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.jobbtn:hover{background:rgba(255,255,255,.18)}
.savechip{font-size:12px;opacity:.85;font-family:var(--f-mono)}
/* stepper */
.stepper{background:var(--panel);border-bottom:1px solid var(--line)}
.steps{display:flex;gap:4px;overflow-x:auto;padding-block:10px;scrollbar-width:thin}
.step{flex:1 0 auto;display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:8px;border:1px solid transparent;background:none;cursor:pointer;text-align:left;min-width:132px}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12.5px;font-weight:500;border:1.5px solid var(--line);color:var(--muted);flex:none}
.step .t{font-size:13.5px;font-weight:600;line-height:1.2}
.step .s{font-size:11.5px;color:var(--muted);line-height:1.2}
.step:hover:not([disabled]){background:var(--panel-2)}
.step.cur{background:var(--brand-soft);border-color:var(--line)}
.step.cur .n{border-color:var(--brand);background:var(--brand);color:#fff}
:root[data-theme="dark"] .step.cur .n{border-color:var(--accent);background:var(--accent);color:#14202e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .step.cur .n{border-color:var(--accent);background:var(--accent);color:#14202e}}
.step.done .n{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.step[disabled]{opacity:.5;cursor:not-allowed}
.progress{height:3px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
/* main */
main{padding-block:22px 60px}
.head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-size:24px}
.head p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.panel+.panel{margin-top:14px}
.panel h2{font-size:16.5px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.split{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:860px){.grid2,.split{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.stack{display:flex;flex-direction:column;gap:10px}
/* buttons */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px}
.btn:hover:not([disabled]){background:var(--panel-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover:not([disabled]){filter:brightness(1.12);background:var(--brand)}
:root[data-theme="dark"] .btn.primary{background:var(--accent);border-color:var(--accent);color:#16202b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{background:var(--accent);border-color:var(--accent);color:#16202b}}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.step:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.jobbtn:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* forms */
label.f{display:flex;flex-direction:column;gap:5px;min-width:0}
label.f .lab{font-size:12.5px;font-weight:600;color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:space-between}
input[type=text],input[type=date],select,textarea{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);padding:8px 10px;min-width:0}
textarea{resize:vertical;min-height:70px;line-height:1.45}
select{padding:6px 8px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:700px){.fields{grid-template-columns:minmax(0,1fr)}}
.fields .wide{grid-column:1/-1}
/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.chip.need{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--brand-soft);color:var(--ink)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.notice{border-radius:8px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.notice.warn{background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.notice.bad{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.notice.ok{background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.notice.info{background:var(--brand-soft);border:1px solid var(--line)}
/* tables */
.tframe{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.t{border-collapse:collapse;width:100%;font-size:13.5px;min-width:640px}
table.t th{background:var(--panel-2);text-align:left;font-size:12px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:none}
table.t td[contenteditable="true"]{background:color-mix(in srgb,var(--panel-2) 60%,transparent);cursor:text}
table.t td[contenteditable="true"]:hover{box-shadow:inset 0 0 0 1px var(--line)}
table.t td.edited{box-shadow:inset 3px 0 0 var(--accent)}
table.t select{min-width:96px}
.idc{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab .chip{margin-left:4px}
/* sources */
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;background:var(--panel-2);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.src{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.src .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.src pre{grid-column:1/-1;margin:0;max-height:180px;overflow:auto;background:var(--panel-2);border-radius:6px;padding:10px;font-family:var(--f-mono);font-size:12px;white-space:pre-wrap;word-break:break-word}
/* questions */
.q{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--panel)}
.q .qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.q p{margin:0 0 8px;font-weight:500}
.qa-log{font-size:13px;border-left:2px solid var(--line);padding-left:10px;display:flex;flex-direction:column;gap:6px}
/* paper */
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:4px;padding:clamp(18px,4vw,48px);max-width:860px;margin:0 auto;box-shadow:var(--shadow);font-size:14.5px;line-height:1.55}
.paper h1{font-size:24px;margin:0 0 14px}
.paper h2{font-size:17px;margin:26px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.paper h3{font-size:15px;margin:18px 0 6px}
.paper p{margin:0 0 9px;max-width:72ch}
.paper .cover{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:3px 14px;margin-bottom:10px;font-size:14px}
.paper .cover b{font-weight:600}
.paper .fpart{margin:0 0 6px}
.paper .fpart b{font-weight:600}
.paper ul{margin:0 0 10px;padding-left:20px}
.ph{margin:10px 0 14px;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--panel-2);max-width:520px}
.ph img{display:block;width:100%;height:auto;border-radius:3px}
.ph figcaption{font-size:12.5px;color:var(--muted);margin-top:6px}
.ph-empty{margin:10px 0 14px;border:1.5px dashed var(--line);border-radius:6px;padding:12px;max-width:520px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.ph-empty.req{border-color:color-mix(in srgb,var(--warn) 60%,transparent);background:var(--warn-soft)}
.ph-empty b{color:var(--ink);font-weight:600}
.ph-empty span{flex:1;min-width:180px}
.pmap{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.pmap .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
.pmap .dots{display:flex;gap:4px}
.pmap .dots i{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--line);display:block}
.pmap .dots i.f{background:var(--ok);border-color:var(--ok)}
.pmap .dots i.q{border-color:var(--warn)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:8px}
.slot{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel);display:flex;flex-direction:column;gap:8px;min-width:0}
.slot .thumb{aspect-ratio:4/3;border-radius:5px;border:1.5px dashed var(--line);display:grid;place-items:center;overflow:hidden;background:var(--panel-2);font-size:12.5px;color:var(--muted);text-align:center;padding:6px}
.slot .thumb img{width:100%;height:100%;object-fit:cover}
.slot .shot{font-size:13px}
.slot input{width:100%}
.need-txt{background:var(--warn-soft);color:var(--warn);border-radius:3px;padding:0 3px;font-weight:600}
.unv-txt{background:var(--bad-soft);color:var(--bad);border-radius:3px;padding:0 3px;font-weight:600}
/* QA */
.check{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:start}
.check:last-child{border-bottom:none}
.check .num{font-family:var(--f-mono);font-size:13px;color:var(--muted);padding-top:2px}
.check .name{font-weight:600}
.check .det{font-size:13px;color:var(--muted);margin-top:2px}
.gate{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px;border-radius:var(--r)}
.gate.open{background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.gate.shut{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.gate .big{font-family:var(--f-display);font-weight:700;font-size:19px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 12px;font-size:13.5px}
.sumlist{margin:0;padding-left:18px;font-size:13.5px}
.sumlist li{margin-bottom:4px}
/* export */
.exp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.exp{grid-template-columns:minmax(0,1fr)}}
.doccard{display:flex;gap:14px;align-items:flex-start}
.doccard .ic{width:44px;height:54px;border-radius:5px;background:var(--brand-soft);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--brand);flex:none}
:root[data-theme="dark"] .doccard .ic{color:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .doccard .ic{color:var(--accent)}}
/* overlay */
.overlay{position:fixed;inset:0;background:rgba(10,18,28,.45);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:20px;width:min(460px,100%)}
.dialog h3{font-size:17px;margin-bottom:6px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:sp 0.9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}.progress i{transition:none}}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);width:min(340px,calc(100vw - 32px));padding:8px;z-index:20}
.menu .it{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 10px;border-radius:7px;cursor:pointer;border:none;background:none;width:100%;text-align:left}
.menu .it:hover{background:var(--panel-2)}
.menu .it.cur{background:var(--brand-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:8px;font-size:13.5px;z-index:60;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:34px 16px}
.empty h2{font-size:18px;margin-bottom:6px}
/* v5: next bar, home, profile, editable draft, pass/fix list */
.nextbar{position:sticky;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -2px 14px rgba(20,34,49,.07)}
.nextbar .wrap{display:flex;gap:12px;align-items:center;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.nextbar .info{flex:1;min-width:0;font-size:13px;color:var(--muted);line-height:1.35}
.nextbar .info b{color:var(--ink)}
.nextbar .btn.primary{font-size:15px;padding:11px 18px}
@media (max-width:560px){.nextbar .info{display:none}.nextbar .btn.primary{flex:1;justify-content:center}}
.home-types{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.home-types .panel+.panel{margin-top:0}
.tcard{display:flex;flex-direction:column;gap:10px}
.tcard p{margin:0;color:var(--muted);font-size:13.5px;flex:1}
.jlist{display:flex;flex-direction:column;gap:8px}
.jr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);align-items:center}
.jr b{word-break:break-word}
@media (max-width:560px){.jr{grid-template-columns:minmax(0,1fr)}}
.minibar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:7px;max-width:280px}
.minibar i{display:block;height:100%;background:var(--accent)}
.step.locked .n{border-style:dashed}
.step.locked .s{color:var(--warn)}
.lockview{max-width:580px;margin:28px auto;text-align:center}
.lockview .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;background:var(--warn-soft);color:var(--warn)}
.paper [data-dp]{border-radius:3px;outline:none;cursor:text}
.paper [data-dp]:hover{box-shadow:0 0 0 1px var(--line)}
.paper [data-dp]:focus{box-shadow:0 0 0 2px var(--accent);background:color-mix(in srgb,var(--accent-soft) 70%,transparent)}
.paper .brandhead{display:flex;gap:14px;align-items:center;margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid var(--brand)}
:root[data-theme="dark"] .paper .brandhead{border-bottom-color:var(--accent)}
.paper .brandhead img{max-height:56px;max-width:200px;object-fit:contain}
.paper .brandhead b{font-family:var(--f-display);font-size:18px}
.paper .signoff{margin-top:30px;padding-top:14px;border-top:1px solid var(--line)}
.paper .sigline{margin:22px 0 2px;letter-spacing:.02em}
.paper .assist{font-size:12.5px;color:var(--muted);font-style:italic;margin-top:14px}
.paper .samplebar{font-size:12.5px;margin:-6px 0 14px}
.flash{animation:fl 2s ease-out}
@keyframes fl{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:none}}
.fix{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:start}
.fix:last-child{border-bottom:none}
.fix .name{font-weight:600}
.fix .det{font-size:13.5px;color:var(--muted);margin-top:2px}
.passlist{margin:0;padding:0;list-style:none;font-size:13.5px}
.passlist li{padding:6px 0;border-bottom:1px solid var(--line)}
.passlist li:last-child{border-bottom:none}
details.more>summary{cursor:pointer;font-weight:600;font-size:14px;padding:4px 0}
.logo-prev{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo-prev img{max-height:64px;max-width:220px;border:1px solid var(--line);border-radius:6px;padding:6px;background:#fff}
.sigprev{white-space:pre-wrap;font-size:14px;border-left:3px solid var(--line);padding-left:12px}

  projectRules: `You build [REPORT TYPE] reports for [CONSULTANT NAME], an independent consultant. Engine ID: [CLIENT ID], licensed by Skilled Edge Group LLC for this consultant only. The consultant reviews, signs and sends every report. You draft and flag; they decide.

Workflow: 1 JOB SHEET (every job-specific detail comes from the job sheet; write [needed] for anything missing). 2 FINDINGS BUILDER (pull findings from the notes first, then interview the consultant one Blank Template section at a time, only about gaps; max 3 short questions at a time; fill the Intake Template; ask injury, treatment or near-miss questions before going on; show a findings table and wait for approval). 3 DRAFT (Blank Template for structure, Style Rules for voice, Findings Library wording where it fits; only the job sheet and approved findings). 4 QA (all 15 checks; cite only Verified Citation Library sections, anything else is "(unverified)" and blocks release; never assign a risk rating, use the consultant's ratings only; check 15 against the Carryover List; end with the Report Summary). 5 EDITS.

- Cite a regulation only when the observed condition actually breaks what that regulation requires. If the requirement is met and the issue is a best practice, write it as a recommendation with no citation.

Never invent names, dates, measurements or facts. Write [needed] instead. Never reuse anything from the Carryover List.`,

      { topic: "Forklift evaluation", cite: "1910.178(l)(4)(iii)", requires: "Operator performance evaluated at least once every 3 years", note: "\"Expired\" means more than 3 years unless client policy is stricter." },
      { topic: "Forklift pre-use exam", cite: "1910.178(q)(7)", requires: "Trucks examined before service; not used if a safety-affecting condition exists", note: "Action = out of service now." },
      { topic: "Forklift defects", cite: "1910.178(p)(1)", requires: "Defective/unsafe truck taken out of service until restored", note: "" },
      { topic: "Exit route obstructions", cite: "1910.37(a)(3)", requires: "Exit routes kept free of obstructions", note: "Paragraph number from OSHA eTool and interpretation index; full text not quoted. Re-check.", confirm: true },
      { topic: "Exit safeguards", cite: "1910.37(a)(4)", requires: "Emergency safeguards, including exit lighting, in working order at all times", note: "" },
      { topic: "Exit signs", cite: "1910.37(b)", requires: "Lighting and marking adequate and appropriate", note: "Exact sub-paragraph for illumination not yet confirmed.", confirm: true },
      { topic: "Exit access width", cite: "1910.36(g)(2)", requires: "Exit access at least 28 inches wide at all points", note: "44 in. is a building-code figure, not OSHA." },
      { topic: "SDS access", cite: "1910.1200(g)(8)", requires: "SDSs readily accessible each shift in the work area", note: "Electronic OK only with no barriers to employee access." },
      { topic: "Eyewash", cite: "1910.151(c)", requires: "Quick-drench/flush facilities where exposed to injurious corrosive materials", note: "Ask: is the chemical corrosive? No frequency in OSHA. Monthly/weekly = client policy or ANSI Z358.1.", trigger: true },
      { topic: "Walking-working surfaces", cite: "1910.22(a)(1)", requires: "Workplaces kept clean, orderly and sanitary", note: "Trip hazards." },
      { topic: "Extinguisher monthly", cite: "1910.157(e)(2)", requires: "Visual inspection monthly", note: "" },
      { topic: "Extinguisher annual", cite: "1910.157(e)(3)", requires: "Annual maintenance check, date recorded", note: "" }

    clientPolicy: []

  intakeTemplate: `A. Packet inventory: Item | Type | Status | Notes. Field notes (text / voice-memo transcript / photo of handwritten notes; received / reviewed). Attachments, each document (received and reviewed / received not reviewed / not received; if not reviewed, no finding may cite it as evidence). Prior report(s) (received / not received; repeat findings require a source). Status rule: any finding that cites an item with status other than "received and reviewed" must carry "(not reviewed)" in the finding.
B. Conflicts register: # | Item | Source 1 (value) | Source 2 (value) | Resolution owner | Resolution. Every disagreement between sources goes here, including headcount, measurements, dates, names and training status. Nothing is resolved silently.
C. Names: full names appear only if the client supplied them in writing. Otherwise "[name needed]" or the job title. Initials or partial names ("Luis?") are never expanded.
D. Notes not used: every item in the field notes that does not become a finding, a conflict or an open question goes here with a one-line reason. Injuries or treatment mentions, near misses, conflicting measurements and unverified observations must appear here if not turned into findings.
E. Injury and incident prompts: any mention of an injury, treatment, near miss or unlogged incident goes to the consultant as a question, not a finding. The consultant answers before drafting continues.
F. Figures and sources: every number, date and measurement names its source (document, measurement log, or the consultant's own observation).
G. Requirements: each regulation cited is checked against the verified citation library before release. Client policy is labeled "client policy," never attributed to a regulation. A cite not in the library is marked "(unverified)."`,
  blankTemplate: `# Workplace Safety Audit Report
Cover lines: Client: [Client] · Site: [Location] · Audit date: [Visit date] · Report date: [Report date] · Report no.: [Report number], Rev [revision] · Prepared by: [Consultant name, credentials] – [Consultant firm] · Site contact: [Name, title – only as given in writing]
## 1. Executive Summary
Paragraph 1: who conducted the audit, where, when, and which areas were covered.
Paragraph 2: number of findings by rating; any repeat findings with the prior report number; any conditions corrected or acted on during the audit.
Table: Rating | Count (High, Medium, Low, Total). Counts are recomputed from Section 3.  -> use a {"type":"counts"} block here.
## 2. Scope and Method
Method (walk-through, document review, interviews), documents reviewed, and what was not included.
## 3. Findings
Intro line: "Each finding is written as Condition, Requirement, Risk and Recommended Action. Risk ratings use the consultant's risk matrix (Appendix A)."
For each finding: F-[n] [Short title stating the condition] ([Rating]) [– REPEAT if applicable], with four labeled parts: Condition (what was observed, where, and the evidence); Requirement (REGULATION – [cite from library]: [plain-language paraphrase]. Or CLIENT POLICY – [document]: [rule].); Risk (one sentence on the consequence); Recommended action (immediate action, note if completed on site and the date, then the lasting fix).
Recommendations (best practice, no citation): Rec-[n] [title] with Condition and Recommended action.
## 4. Open Items
Table: # | Item | Owner (job title) | Status.
## 5. Positive Observations
Two to four short bullets.
## 6. Limitations
Standard paragraph: conditions on the audit date only; not a guarantee that no other hazards exist; based on areas, documents and people available.
## Appendix A – Risk Matrix
The consultant's own matrix, unchanged (from the job sheet).`,
  styleRules: `Voice: third person, past tense for observations ("had been removed," "was blocked"). The firm is the subject in the summary ("[Firm] conducted…"), never "I" or "we."
Sentence length: short and plain, usually under 25 words. One idea per sentence.
Finding titles: state the condition, not the rule. Rating in parentheses. "– REPEAT" when the prior report recorded the same condition.
Finding structure: always four labeled parts, in order: Condition, Requirement, Risk, Recommended action.
Condition: exact item and location, then the evidence (checklist, tag, document, observation).
Requirement: label first (REGULATION or CLIENT POLICY), then the cite, then a plain-language paraphrase after a colon. No quoted regulation text.
Risk: one sentence, consequence-focused, no exaggeration.
Recommended action: immediate step first, with "(completed on site, [date])" when done; then the lasting fix. Owners are job titles, not names.
Numbers: numerals for counts; dates written as "March 4, 2026."
Words avoided: "egregious," "blatant," "failed to," "it is recommended that," "please note," "ensure compliance."
Tables: summary counts table in Section 1; open items table in Section 4.`,
  findingsLibrary: `Powered industrial trucks — Title: Forklift operated with [defect]. Condition: [Truck ID] had [defect]. The [period] pre-use checklist recorded [entry] on [n] days, and the truck remained in service. Requirement: REGULATION – 29 CFR 1910.178(q)(7): trucks are examined before being placed in service and are not used if any condition adversely affects safety. Risk: [Consequence for pedestrians or operator.] Recommended action: Remove [truck ID] from service until repaired. Require supervisors to review pre-use checklists daily and tag out any truck with a safety defect.
Title: Operator evaluation older than three years. Requirement: REGULATION – 29 CFR 1910.178(l)(4)(iii): operator performance evaluated at least once every three years. Recommended action: Evaluate [operator role] before further operation and set a three-year tracking date.
Exit routes — Title: Exit route blocked at [location]. Requirement: REGULATION – 29 CFR 1910.37(a)(3): exit routes kept free of obstructions. Risk: Delayed evacuation during a fire or other emergency. Recommended action: Clear the route. Paint floor markings for a keep-clear zone and add the route to the weekly supervisor walk.
Fire extinguishers — Title: Fire extinguisher monthly inspections not recorded. Requirement: REGULATION – 29 CFR 1910.157(e)(2): portable extinguishers visually inspected monthly. Risk: A discharged or damaged extinguisher may go unnoticed. Recommended action: Inspect all extinguishers now and assign a named owner for monthly checks.
Machine guarding — Title: [Machine] guard removed. Requirement: REGULATION – 29 CFR 1910.212(a)(1): one or more methods of machine guarding to protect the operator and other employees. Risk: Contact with [hazard] can cause severe lacerations or amputation. Recommended action: Reinstall the guard before next use and tag the machine out of service until then.
Hazard communication — Title: Safety Data Sheets missing in [area]. Requirement: REGULATION – 29 CFR 1910.1200(g)(8): SDSs readily accessible to employees in their work areas during each shift. Risk: Employees may not have hazard and first-aid information during a spill or exposure. Recommended action: Add the missing SDSs and reconcile the binder against the area's chemical inventory.
Lockout/tagout — Title: Lockout locks without employee identification. Requirement: REGULATION – 29 CFR 1910.147(c)(5)(ii)(D): lockout devices indicate the identity of the employee applying them. Risk: A lock may be removed by the wrong person, or the person who applied it cannot be identified. Recommended action: Label all locks with the assigned employee's name and audit lock assignments quarterly.

/* ---------------- utilities ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID().replace(/-/g, "").slice(0, 12) : Math.random().toString(36).slice(2, 14));
const nowISO = () => new Date().toISOString();
const fmtDate = iso => { try { return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); } catch { return ""; } };
const fmtTime = iso => { try { return new Date(iso).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); } catch { return ""; } };
const clone = o => JSON.parse(JSON.stringify(o));
const arr = v => Array.isArray(v) ? v : [];
const str = v => (v == null ? "" : typeof v === "string" ? v : typeof v === "number" ? String(v) : JSON.stringify(v));
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3200); }
function hl(text) { return esc(text).replace(/\[(?:name )?needed\]|\[verify:[^\]]*\]/gi, m => `<span class="need-txt">${m}</span>`).replace(/\(unverified\)/gi, m => `<span class="unv-txt">${m}</span>`); }
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch { } }

const S = { jobs: [], job: null, tab: "findings", store: "device", uid: null, db: null, saving: false, dirty: false, presetsLoaded: false, page: "home", profile: {}, savedAt: null, confirmDel: null, confirmRebuild: false, focus: null, libId: null };

/* ---------------- persistence (db per viewer, device fallback) ---------------- */
async function initStore() {
  try {
    if (window.claude && claude.use) {
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (db && user) { const id = await user.id(); if (id) { S.db = db; S.uid = id; S.store = "account"; } }
    }
  } catch (e) { S.db = null; }
}
function jobsColl() { return S.db.collection("data/users/" + S.uid); }
async function loadJobs() {
  let jobs = [];
  if (S.db) {
    try {
      const snap = await Promise.race([jobsColl().get(), new Promise((_, r) => setTimeout(() => r({ code: "timeout" }), 10000))]);
      snap.docs.forEach(d => { const v = d.data(); if (d.id === "profile" && v) S.profile = v; else if (v && v.id && d.id.startsWith("job-")) jobs.push(v); });
    } catch (e) { S.store = "device"; S.db = null; }
  }
  if (!S.db) { try { jobs = JSON.parse(lsGet("re.jobs") || "[]"); } catch { jobs = []; } }
  if (!S.profile || !Object.keys(S.profile).length) { try { S.profile = JSON.parse(lsGet("re.profile") || "{}"); } catch { S.profile = {}; } }
  jobs.sort((a, b) => String(b.updated).localeCompare(String(a.updated)));
  S.jobs = jobs;
}
let saveTimer = null;
function markDirty() { if (!S.job) return; S.job.updated = nowISO(); S.dirty = true; setSaveChip("Saving…"); clearTimeout(saveTimer); saveTimer = setTimeout(saveJob, 1200); }

async function addFiles(files) {
  for (const f of files) {
    const name = f.name; const ext = (name.split(".").pop() || "").toLowerCase();
    try {
      let text = "", kind = "Field notes", note = "";
      if (["txt", "md", "csv"].includes(ext) || (f.type || "").startsWith("text/")) text = await f.text();
      else if (ext === "docx") { await loadScript("https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"); const r = await mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() }); text = r.value; kind = "Attachment"; }
      else if (ext === "pdf") { text = await pdfText(f); kind = "Attachment"; }
      else if (["png", "jpg", "jpeg", "webp", "gif"].includes(ext)) {
        const t = await askText("Reading the notes in " + name, promptPhoto(name), { images: [f], sub: "Claude transcribes the writing only. It does not analyze the photo." });
        if (t.trim() === "NOT_NOTES") { await addSitePhotos([f], true); toast(`${name} looks like a site photo, so it was added to Site photos.`); continue; }
        text = t; kind = "Photo of notes"; note = "transcribed from photo";
      } else { toast(`${name}: this file type isn't supported. Use PDF, Word, text or a photo of notes.`); continue; }
      text = (text || "").replace(/\r/g, "").trim();
      if (!text) { toast(`${name} had no readable text.`); continue; }
      S.job.sources.push({ id: uid(), name, kind, status: kind === "Attachment" ? "received not reviewed" : "received and reviewed", text, note });
    } catch (e) { const m = errMsg(e); if (m) toast(`${name}: ${m === ERR.unavailable ? m : "couldn't read this file. Paste its text instead."}`); }
  }
  markDirty(); renderAll();
}
const loaded = {};
function loadScript(src) { if (!loaded[src]) loaded[src] = new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => { delete loaded[src]; rej(new Error("load")); }; document.head.appendChild(s); }); return loaded[src]; }
async function pdfText(file) {
  await loadScript("https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js");
  const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

  return out.join("\n\n");
}

  if (t.dataset.skip) { collectAnswers(); const q = j.interview.find(q => q.id === t.dataset.skip); if (q.kind === "injury") { toast("Injury questions stay open until you answer them."); return; } q.skipped = true; markDirty(); renderView(); return; }
  if (t.dataset.tab) { S.tab = t.dataset.tab; renderView(); return; }
  if (t.id === "addRow") { const c = CFG(); const n = j.intake.items.filter(x => /^F-\d+$/.test(x.id)).reduce((m, x) => Math.max(m, Number(x.id.slice(2))), 0) + 1; const it = { _manual: true, _edits: [] }; c.columns.forEach(col => it[col.key] = col.options ? col.options[0] : ""); it.id = "F-" + n; it.action = ""; j.intake.items.push(it); markDirty(); renderView(); return; }
  if (t.dataset.sdel) { scoreRows(CFG(), j).splice(Number(t.dataset.sdel), 1); markDirty(); renderView(); return; }
  if (t.id === "addScore") { scoreRows(CFG(), j).push({ cat: "New category", level: "[needed]" }); markDirty(); renderView(); return; }
  if (t.dataset.delrow) { j.intake.items.splice(Number(t.dataset.delrow), 1); markDirty(); renderView(); return; }
  if (t.id === "reopen") { j.approved = false; markDirty(); renderAll(); return; }
  if (t.id === "applyEdit") { const r = $("#editReq").value.trim(); if (!r) { toast("Describe the change first."); return; } await editDraft(r); return; }
  if (t.id === "applySheet") { const c = CFG(); const before = j.jobSheetAtDraft || {}; const ch = c.jobSheetFields.filter(f => (before[f.key] || "") !== (j.jobSheet[f.key] || "")).map(f => `${f.label}: was "${before[f.key] || "[needed]"}", now "${j.jobSheet[f.key] || "[needed]"}"`); await editDraft("The job sheet changed. Update every place these values appear in the report, and nothing else:\n" + ch.join("\n"), "Updating the job-sheet values everywhere"); return; }
  if (t.id === "runQA") { await runQA(); return; }
  if (t.id === "runFinal") { const tx = $("#finalText").value.trim(); if (tx.length < 200) { toast("Paste the full report text first."); return; } await runQA(tx); return; }
  if (t.id === "clearFinal") { j.finalCheck = null; markDirty(); renderView(); return; }
  if (t.id === "dlQA") { await exportDoc("qa"); return; }
});
document.addEventListener("change", e => {
  const el = e.target; const j = S.job; if (!j || S.page) return;
  if (el.dataset.srcKind) { j.sources.find(s => s.id === el.dataset.srcKind).kind = el.value; markDirty(); }
  if (el.dataset.srcStatus) { j.sources.find(s => s.id === el.dataset.srcStatus).status = el.value; markDirty(); }
  if (el.dataset.cell && el.tagName === "SELECT") { setCell(el.dataset.cell, el.value); renderView(); }
  if (el.dataset.slevel) { scoreRows(CFG(), j)[Number(el.dataset.slevel)].level = el.value; markDirty(); renderView(); return; }
  if (el.dataset.signoff) { j.signoff[el.dataset.signoff] = el.checked; markDirty(); renderView(); renderNext(); }
});
document.addEventListener("input", e => { const el = e.target; if (el.dataset.pf) { S.profile = { ...profile(), [el.dataset.pf]: el.value }; saveProfileSoon(); const pv = $(".sigprev"); if (pv) pv.textContent = signatureBlock() + "\nSignature: ______________________   Date: ____________"; return; } if (el.dataset.cap && S.job && S.job.photos && S.job.photos[el.dataset.cap]) { S.job.photos[el.dataset.cap].caption = el.value; markDirty(); return; } if (el.dataset.ans) { const q = S.job.interview.find(q => q.id === el.dataset.ans); if (q) { q.answer = el.value; markDirty(); } } });
document.addEventListener("focusout", e => { const el = e.target; if (el.dataset && el.dataset.dp && S.job && S.job.draft) { const v = (el.innerText ?? el.textContent).replace(/\u00a0/g, " ").replace(/\n{3,}/g, "\n\n").trim(); if (setDraftPath(el.dataset.dp, v)) { S.job.editedAt = nowISO(); markDirty(); renderSteps(); renderNext(); } return; } if (el.dataset && el.dataset.scat && el.isContentEditable && S.job) { const r = scoreRows(CFG(), S.job)[Number(el.dataset.scat)]; const v = (el.innerText ?? el.textContent).trim(); if (r && v && r.cat !== v) { r.cat = v; markDirty(); } return; } if (el.dataset && el.dataset.cell && el.isContentEditable) { setCell(el.dataset.cell, (el.innerText ?? el.textContent).trim()); el.classList.add("edited"); } });
function setCell(ref, val) { const [ri, key] = ref.split(":"); const it = S.job.intake.items[Number(ri)]; if (!it || it[key] === val) return; it[key] = val; it._edits = [...new Set([...arr(it._edits), key])]; markDirty(); }
function collectAnswers() { document.querySelectorAll("[data-ans]").forEach(el => { const q = S.job.interview.find(q => q.id === el.dataset.ans); if (q) q.answer = el.value; }); }
$("#photoIn").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; const k = S.pickSlot; S.pickSlot = null; if (f && k) addPhoto(k, f); });
$("#sitePhotoIn").addEventListener("change", e => { const f = [...e.target.files]; e.target.value = ""; if (f.length) addSitePhotos(f); });
$("#logoIn").addEventListener("change", async e => { const f = e.target.files[0]; e.target.value = ""; if (!f) return; try { const im = await readImage(f); const k = Math.min(1, 600 / Math.max(im.naturalWidth, im.naturalHeight)); const cv = document.createElement("canvas"); cv.width = Math.round(im.naturalWidth * k); cv.height = Math.round(im.naturalHeight * k); cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height); const png = /png/i.test(f.type); const url = cv.toDataURL(png ? "image/png" : "image/jpeg", 0.9); if (url.length > 200000) { toast("That logo is too large. Try a smaller file."); return; } S.profile = { ...profile(), logo: url }; saveProfileSoon(); renderView(); } catch { toast("That image couldn't be read. Try a PNG or JPEG."); } });
document.addEventListener("paste", e => { if (!S.job || S.page || S.job.step !== 2) return; const files = [...(e.clipboardData && e.clipboardData.files || [])].filter(f => /^image\//.test(f.type)); if (files.length) { e.preventDefault(); addSitePhotos(files); } });
$("#fileIn").addEventListener("change", e => { const f = [...e.target.files]; e.target.value = ""; if (f.length) addFiles(f); });
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.id === "drop") { e.preventDefault(); $("#fileIn").click(); } if ((e.key === "Enter" || e.key === " ") && e.target.id === "photoDrop") { e.preventDefault(); $("#sitePhotoIn").click(); } });
document.addEventListener("dragover", e => { const d = e.target.closest && e.target.closest("#drop,#photoDrop"); if (d) { e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", e => { const d = e.target.closest && e.target.closest("#drop,#photoDrop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", e => { const d = e.target.closest && e.target.closest("#drop,#photoDrop"); if (d) { e.preventDefault(); d.classList.remove("over"); if (d.id === "photoDrop") addSitePhotos([...e.dataTransfer.files]); else addFiles([...e.dataTransfer.files]); } });
window.addEventListener("beforeunload", () => { if (S.dirty) saveJob(); });

/* one-click finished sample: a copy of the report type's built-in sample job (made-up company) */
function openSample(presetId) {
  const c = PRESETS[presetId]; if (!c || !c.sampleJob) return;
  const base = newJob(presetId); const sj = clone(c.sampleJob);
  const j = { ...base, ...sj, id: uid(), presetId, sample: true, created: nowISO(), updated: nowISO(), step: 4, photos: {}, extraPhotos: 0, signoff: { conflicts: false, scope: false, release: false }, finalCheck: null, editedAt: null };
  j.approvedAt = nowISO(); j.draftAt = nowISO(); j.jobSheetAtDraft = clone(j.jobSheet);
  S.job = j; S.page = null; S.dtab = "report"; S.tab = "findings";
  if (sj.qa) { const auto = autoChecks(j, draftToText(j.draft), j.draft); j.qa = { checks: c.qaChecks.map(q => auto[q.n] ? { n: q.n, ...auto[q.n] } : (sj.qa.checks.find(x => x.n === q.n) || { n: q.n, status: "pass", ids: [], detail: "" })), summary: sj.qa.summary || {}, at: nowISO() }; j.qaAt = nowISO(); }
  markDirty(); renderAll(); window.scrollTo({ top: 0 });
  toast("Sample opened. It uses a made-up company.");
}
/* ---------------- boot ---------------- */
async function loadPresets() {
  for (const p of PRESET_FILES) {
    try { const r = await fetch(p, { cache: "no-store" }); if (r.ok) { const cfg = await r.json(); if (cfg && cfg.id && cfg.qaChecks) PRESETS[cfg.id] = cfg; } } catch { }
  }
}
(async function boot() {
  setSaveChip("");
  renderAll();
  await Promise.all([initStore(), loadPresets()]);
  await loadJobs();
  S.page = "home";
  setSaveChip(S.store === "account" ? "Jobs save to your account" : "Jobs save on this device");
  renderAll();
})();
